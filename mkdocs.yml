          - "2.7 Composition of Functions": ap-precalculus/unit-2/2.7-composition-of-functions.md
          - "2.8 Inverse Functions": ap-precalculus/unit-2/2.8-inverse-functions.md
      - "Unit 3: Trigonometric & Polar Functions": ap-precalculus/unit-3-trigonometric-polar.md
