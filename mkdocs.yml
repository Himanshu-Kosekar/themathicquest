site_name: Mathic Quest
site_url: https://themathicquest.com/
site_description: High-yield STEM study guides, practice problems, and interactive resources for AP Precalculus, AP Calculus AB, and beyond.
site_author: MathicQuest Team
copyright: Copyright &copy; 2026 Mathic Quest

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  language: en
  palette:
    # Palette toggle for automatic / light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/desmos-loader.js
  - javascripts/clickable-rows.js

nav:
  - Home: index.md
  - AP Precalculus:
      - Overview: ap-precalculus/index.md
      - "Unit 1: Polynomial & Rational Functions":
          - "Unit 1 Overview": ap-precalculus/unit-1-polynomial-rational.md
          - "1.1 Change in Tandem": ap-precalculus/unit-1/1.1-change-in-tandem.md
          - "1.2 Rates of Change": ap-precalculus/unit-1/1.2-rates-of-change.md
          - "1.3 Rates of Change in Linear & Quadratic": ap-precalculus/unit-1/1.3-rates-of-change-linear-quadratic.md
          - "1.4 Polynomial Rates of Change": ap-precalculus/unit-1/1.4-polynomial-rates-of-change.md
          - "1.5 Complex Zeros": ap-precalculus/unit-1/1.5-complex-zeros.md
          - "1.6 Polynomial End Behavior": ap-precalculus/unit-1/1.6-polynomial-end-behavior.md
          - "1.7 Rational End Behavior": ap-precalculus/unit-1/1.7-rational-end-behavior.md
          - "1.8 Rational Zeros": ap-precalculus/unit-1/1.8-rational-zeros.md
          - "1.9 Vertical Asymptotes": ap-precalculus/unit-1/1.9-rational-vertical-asymptotes.md
          - "1.10 Holes in Rational Functions": ap-precalculus/unit-1/1.10-rational-holes.md
          - "1.11 Equivalent Representations": ap-precalculus/unit-1/1.11-equivalent-representations.md
          - "1.12 Transformations of Functions": ap-precalculus/unit-1/1.12-transformations-of-functions.md
          - "1.13 Model Selection & Assumptions": ap-precalculus/unit-1/1.13-model-selection-articulation.md
          - "1.14 Model Construction & Application": ap-precalculus/unit-1/1.14-model-construction-application.md
      - "Unit 2: Exponential & Logarithmic Functions":
          - "Unit 2 Overview": ap-precalculus/unit-2-exponential-logarithmic.md
          - "2.1 Arithmetic & Geometric Sequences": ap-precalculus/unit-2/2.1-change-arithmetic-geometric-sequences.md
          - "2.2 Linear & Exponential Changes": ap-precalculus/unit-2/2.2-change-linear-exponential-functions.md
          - "2.3 Exponential Functions": ap-precalculus/unit-2/2.3-exponential-functions.md
          - "2.4 Exponential Manipulation": ap-precalculus/unit-2/2.4-exponential-function-manipulation.md
          - "2.5 Context & Data Modeling": ap-precalculus/unit-2/2.5-exponential-context-data-modeling.md
